[project]
name = "lumi"
version = "0.1.0"
description = "Desktop SMB video library browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "PyYAML>=6.0",
    "pydantic-settings>=2.0",
    "py7zr>=0.22",
    "chardet>=5.0",
    "smbprotocol>=1.14",
    "mpv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumi"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
packages = ["lumi"]

[[tool.mypy.overrides]]
module = "smbprotocol.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpv.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "py7zr.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chardet.*"
ignore_missing_imports = true
