<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Library home (A3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Kolory mockupu A3 */
      --bg: #07080f;
      --muted: #8b90a8;
      --text: #eef0f8;
      --accent: #8b5cf6;
      --accent-dim: rgba(139, 92, 246, 0.22);
      --sidebar-bg: #0d0e1f;
      --sidebar-focus: #1a2367;
      --icon-muted: rgba(245, 245, 245, 0.35);
      --icon-active: #f5f5f5;
      /* Skala jak w Lumi: UI_SCALE=1.5, lista/topbar ×1.2 (typography.py, spacing.py) */
      --font-topbar: 36px;
      --font-search: 26px;
      --font-list: 40px;
      --font-list-alt: 22px;
      --font-alphabet: 20px;
      --font-tag: 23px;
      --font-action: 25px;
      --font-banner: 21px;
      --font-xs: 17px;
      --font-count: 25px;
      --row-meta-icon: var(--icon-size);
      --row-meta-gap: 4px;
      --space-sm: 12px;
      --space-md: 24px;
      --space-lg: 36px;
      --section-gap: 18px;
      --icon-size: 36px;
      --icon-size-sm: 24px;
      --hit-target: 48px;
      --divider-h: 24px;
      --radius-sm: 6px;
      --focus-ring: 3px;
      --poster-w: 37%;
      --pad-x: var(--space-md);
      --list-pad-left: 18px;
      --az-col: 48px;
      --az-rail-w: calc(var(--az-col) + var(--az-gap));
      --az-gap: var(--space-md);
      --row-gap: 16px;
      --row-line-gap: 6px;
      --row-meta-gap: 10px;
      --row-thumb-gap: 20px;
      --row-bottom-gap: 10px;
      --row-section-gap: 22px;
      /* 2:3 miniatura — wyższa, żeby zmieścić odcinek + seria + alt + meta bez pionowego clipu */
      --recent-poster-w: 147px;
      --recent-poster-h: 224px;
    }
    html, body {
      height: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    button { font: inherit; cursor: default; border: none; background: none; color: inherit; }
    .icon { width: var(--icon-size); height: var(--icon-size); display: block; flex-shrink: 0; }
    .icon path { fill: currentColor; }
    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }

    .app {
      display: grid;
      grid-template-columns: var(--poster-w) var(--az-rail-w) minmax(0, 1fr);
      grid-template-rows: 1fr;
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
    }
    .app.recent-page {
      grid-template-columns: var(--poster-w) minmax(0, 1fr);
    }
    .app.rebuilding .top-status { display: block; }

    .poster-col {
      position: relative;
      overflow: hidden;
      background: #0a0a12;
      min-height: 0;
    }
    .poster-col__img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.35s ease;
    }
    .poster-col__fade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent 50%, var(--bg) 100%),
                  linear-gradient(0deg, rgba(7, 8, 15, 0.75) 0%, transparent 40%);
    }
    .main-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
    .chrome-top {
      display: flex; flex-wrap: nowrap; align-items: center; gap: var(--space-sm);
      padding: var(--space-md) var(--pad-x) var(--section-gap) var(--list-pad-left);
    }
    .search-wrap {
      flex: 1; display: flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
      padding: 8px var(--space-md);
      min-height: var(--hit-target);
      min-width: 0;
      color: var(--icon-muted);
    }
    .search-wrap .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .search-wrap input {
      flex: 1; min-width: 0; background: transparent; border: none; outline: none;
      color: var(--text);
      font-size: var(--font-search);
      line-height: 1.25;
    }
    .search-wrap input::placeholder { color: var(--muted); opacity: 0.75; }

    .filter-icons { display: flex; flex-shrink: 0; align-items: center; gap: 4px; }
    .filter-icons button,
    .icon-action {
      width: var(--hit-target); height: var(--hit-target);
      border-radius: var(--radius-sm);
      display: grid; place-items: center;
      color: var(--icon-muted);
    }
    .filter-icons button.active { background: var(--accent-dim); color: #c4a8ff; }
    .icon-action.active { background: var(--accent-dim); color: #c4a8ff; }
    .chrome-divider {
      flex-shrink: 0;
      width: 1px;
      height: var(--divider-h);
      margin: 0 var(--space-sm);
      background: rgba(217, 217, 217, 0.2);
    }
    .icon-action.rebuilding { color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }

    /* active = stan wyboru; kb-focus = nawigacja (obwódka) */
    .filter-icons button.kb-focus,
    .icon-action.kb-focus {
      box-shadow: 0 0 0 var(--focus-ring) #fff;
      color: var(--icon-active);
    }
    .filter-icons button.kb-focus:not(.active),
    .icon-action.kb-focus:not(.active) {
      background: rgba(255, 255, 255, 0.06);
    }
    .search-wrap.kb-focus { box-shadow: 0 0 0 var(--focus-ring) #fff; }

    .top-status {
      display: none; margin-left: auto; max-width: 42%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: "JetBrains Mono", monospace; font-size: var(--font-xs); color: var(--accent);
    }

    .chrome-recent {
      display: none;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--pad-x) var(--section-gap) var(--list-pad-left);
    }
    .app.recent-page .chrome-library { display: none; }
    .app.recent-page .chrome-recent { display: flex; }
    .recent-page-title {
      font-size: var(--font-topbar);
      font-weight: 500;
      line-height: 1.1;
      padding: 6px 0;
      border-radius: var(--radius-sm);
    }
    .recent-page-title.kb-focus {
      box-shadow: 0 0 0 var(--focus-ring) #fff;
    }

    .tag-ribbon-wrap {
      position: relative;
      padding: 0 var(--pad-x) var(--space-sm) var(--list-pad-left);
    }
    .tag-ribbon {
      display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
    }
    .tag-ribbon button {
      font-size: var(--font-tag);
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
    }
    .tag-ribbon button.active { color: #c4a8ff; background: var(--accent-dim); }
    .tag-ribbon button.kb-focus {
      box-shadow: 0 0 0 var(--focus-ring) #fff;
      color: var(--text);
    }
    .tag-ribbon button.kb-focus:not(.active) {
      background: rgba(255, 255, 255, 0.06);
    }
    .az-rail {
      min-height: 0;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0;
      background: var(--bg);
    }
    .list-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    /* Ten sam język co tagi / filtry: accent-dim + obwódka kb-focus. */
    .az {
      width: var(--az-col);
      box-sizing: border-box;
      height: 100%;
      min-height: 0;
      margin-right: var(--az-gap);
      padding: var(--space-sm) 0 var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-y: auto;
      overflow-x: visible;
      scrollbar-width: none;
      mask-image: linear-gradient(
        180deg,
        transparent 0,
        #000 28px,
        #000 calc(100% - 28px),
        transparent 100%
      );
    }
    .az::-webkit-scrollbar { display: none; }
    .az-stack {
      margin-block: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .az-letter {
      width: 36px;
      height: 34px;
      flex: 0 0 34px;
      padding: 0;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      font-size: var(--font-alphabet);
      font-weight: 500;
      color: var(--muted);
      border-radius: 999px;
      background: transparent;
    }
    .az-letter.active {
      color: #c4a8ff;
      background: var(--accent-dim);
    }
    .az-letter.kb-focus {
      box-shadow: 0 0 0 var(--focus-ring) #fff;
      color: var(--text);
    }
    .az-letter.kb-focus:not(.active) {
      background: rgba(255, 255, 255, 0.06);
    }
    .az-letter.kb-focus.active {
      color: #c4a8ff;
      background: var(--accent-dim);
    }
    .list {
      height: 100%;
      overflow-y: auto;
      padding: 8px var(--space-md) var(--space-md) 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }
    .file-warn {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      place-items: center;
      background: rgba(0, 0, 0, 0.85);
      padding: 2rem;
    }
    .file-warn.visible { display: grid; }
    .file-warn p {
      max-width: 36rem; font-size: var(--font-banner); line-height: 1.5;
      text-align: center; color: var(--text);
    }
    .file-warn code { font-family: "JetBrains Mono", monospace; font-size: 0.9em; }
    .row {
      position: relative;
      padding: 14px 24px 14px var(--list-pad-left);
      border-left: 3px solid transparent;
      cursor: default;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .row__meta {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: var(--row-meta-gap);
      color: var(--muted);
      visibility: hidden;
      pointer-events: none;
    }
    .row.selected.focused .row__meta { visibility: visible; }
    .row__meta svg {
      width: var(--row-meta-icon);
      height: var(--row-meta-icon);
      display: block;
      flex-shrink: 0;
    }
    .row__count {
      font-size: var(--font-count);
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .row.selected {
      border-left-color: var(--accent);
      background: rgba(139, 92, 246, 0.07);
    }
    /* Jak ListEntryDelegate: jedna linia + elide; docelowo marquee na fokusie przy overflow. */
    .row .title {
      font-size: var(--font-list);
      font-weight: 500;
      line-height: 1.12;
    }
    .row .title,
    .row .alt:not(.empty) {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row .alt {
      font-size: var(--font-list-alt);
      color: var(--muted);
      margin-top: var(--row-line-gap);
    }
    .row .alt.empty { display: none; }

    .app.recent-page .tag-ribbon-wrap { display: none; }
    .app.recent-page .az-rail { display: none; }
    .list.recent-list { padding: var(--space-sm) 0 var(--space-md); }

    .recent-row {
      border-left: 3px solid transparent;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .recent-row.selected {
      border-left-color: var(--accent);
      background: rgba(139, 92, 246, 0.07);
    }
    .recent-row__action.kb-action-active {
      background: rgba(139, 92, 246, 0.45);
      color: #fff;
      font-weight: 600;
    }
    .recent-row__actions {
      display: flex;
      visibility: hidden;
      pointer-events: none;
    }
    .recent-row.selected .recent-row__actions {
      visibility: visible;
      pointer-events: auto;
    }

    /* card — miniatura + meta + kolumna akcji */
    .recent-row--card {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) minmax(148px, 168px);
      gap: var(--space-md);
      align-items: center;
      padding: 14px var(--pad-x) 14px var(--list-pad-left);
    }
    .recent-row--card .recent-row__thumb {
      width: 80px; height: 120px;
      border-radius: var(--radius-sm);
      background-size: cover; background-position: center;
    }
    .recent-row--card .recent-row__library {
      font-size: var(--font-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .recent-row--card .recent-row__playable {
      font-size: var(--font-list-alt);
      font-weight: 500;
      margin-top: 2px;
      line-height: 1.2;
    }
    .recent-row--card .recent-row__when {
      font-size: var(--font-xs);
      color: var(--muted);
      margin-top: 6px;
    }
    .recent-row--card .recent-row__bar {
      height: 4px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      margin-top: var(--space-sm);
      overflow: hidden;
    }
    .recent-row--card .recent-row__bar span {
      display: block; height: 100%; background: var(--accent);
    }
    .recent-row--card .recent-row__actions {
      flex-direction: column;
      gap: 8px;
      min-height: calc(var(--font-xs) * 2 + 8px + 20px);
      justify-content: center;
    }
    .recent-row--card .recent-row__action {
      font-size: var(--font-xs);
      padding: 10px 12px;
      border-radius: 999px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
    }
    .recent-row--card .recent-row__action:first-child { background: var(--accent-dim); }

    /* trail — typografia + pasek, akcje inline po prawej */
    .recent-row--trail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-md);
      align-items: center;
      padding: 18px var(--pad-x) 18px var(--list-pad-left);
    }
    .recent-row--trail .recent-row__playable {
      font-size: var(--font-list);
      font-weight: 500;
      line-height: 1.12;
    }
    .recent-row--trail .recent-row__show-meta {
      margin-top: var(--row-meta-gap);
    }
    .recent-row--trail .recent-row__library {
      font-size: var(--font-list-alt);
      color: var(--muted);
      margin-top: var(--row-line-gap);
    }
    .recent-row--trail .recent-row__meta-line {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-top: var(--row-bottom-gap);
      font-size: var(--font-xs);
      color: var(--muted);
    }
    .recent-row--trail .recent-row__bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      max-width: 280px;
    }
    .recent-row--trail .recent-row__bar span {
      display: block; height: 100%; background: var(--accent);
    }
    .recent-row--trail .recent-row__actions {
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      min-width: 120px;
      min-height: calc(var(--font-xs) * 2 + 6px);
      justify-content: center;
    }
    .recent-row--trail .recent-row__action {
      font-size: var(--font-xs);
      padding: 6px 0;
      color: var(--muted);
    }
    .recent-row--trail .recent-row__action.kb-action-active { color: #fff; }

    /* play — overlay na plakacie, segmenty tekstowe zamiast guzików */
    .recent-row--play {
      display: grid;
      grid-template-columns: var(--recent-poster-w) minmax(0, 1fr);
      gap: var(--row-thumb-gap);
      align-items: start;
      padding: 14px var(--pad-x) 14px var(--list-pad-left);
    }
    .recent-row--play .recent-row__thumb-wrap {
      position: relative;
      width: var(--recent-poster-w);
      height: var(--recent-poster-h);
      border-radius: var(--radius-sm);
      overflow: hidden;
      align-self: start;
    }
    .recent-row--play .recent-row__thumb {
      width: 100%; height: 100%;
      background-size: cover; background-position: center;
    }
    .recent-row--play .recent-row__play-badge {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: rgba(7, 8, 15, 0.55);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .recent-row--play.selected .recent-row__play-badge { opacity: 1; }
    .recent-row--play .recent-row__play-badge svg {
      width: 44px; height: 44px;
      color: #fff;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .recent-row--play.selected .recent-row__play-badge--browse svg {
      width: 40px; height: 40px;
    }
    .recent-row--play .recent-row__body {
      display: flex;
      flex-direction: column;
      height: var(--recent-poster-h);
      min-height: var(--recent-poster-h);
      max-height: var(--recent-poster-h);
      min-width: 0;
      align-self: start;
    }
    .recent-row--play .recent-row__top {
      flex: 0 0 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--row-meta-gap);
    }
    .recent-row__show-meta {
      display: flex;
      flex-direction: column;
      gap: var(--row-line-gap);
      min-width: 0;
      flex-shrink: 0;
    }
    .recent-row__playable,
    .recent-row__show-title,
    .recent-row__show-alt {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .recent-row--play .recent-row__playable {
      font-size: var(--font-list);
      font-weight: 500;
      line-height: 1.12;
      min-height: calc(var(--font-list) * 1.12);
    }
    .recent-row--play .recent-row__show-title,
    .recent-row--play .recent-row__show-alt {
      font-size: var(--font-list-alt);
      color: var(--muted);
      line-height: 1.2;
      min-height: calc(var(--font-list-alt) * 1.2);
    }
    .recent-row--play .recent-row__gap {
      flex: 1 1 auto;
      min-height: var(--row-section-gap);
      flex-shrink: 1;
    }
    .recent-row--play .recent-row__bottom {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--row-bottom-gap);
      min-width: 0;
    }
    .recent-row--play .recent-row__when {
      font-size: var(--font-xs);
      color: var(--muted);
    }
    .recent-row--play .recent-row__bar {
      height: 4px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      max-width: 360px;
      overflow: hidden;
    }
    .recent-row--play .recent-row__bar span {
      display: block; height: 100%; background: var(--accent);
    }
    .recent-row--play .recent-row__actions {
      gap: var(--space-lg);
      margin-top: 2px;
      font-size: var(--font-tag);
      min-height: calc(var(--font-tag) * 1.2 + 8px);
      align-items: center;
    }
    .recent-row--play .recent-row__action {
      padding: 4px 0;
      color: var(--muted);
      font-weight: 600;
    }
    .recent-row--play .recent-row__action.kb-action-active {
      color: var(--text);
      background: transparent;
    }

    .recent-row--icons .recent-row__actions { align-items: center; }
    .recent-row--icons .recent-row__action {
      display: grid;
      place-items: center;
      width: var(--hit-target);
      height: var(--hit-target);
      padding: 0;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      color: var(--icon-muted);
    }
    .recent-row--icons .recent-row__action.btn-resume { background: var(--accent-dim); color: #c4a8ff; }
    .recent-row--icons .recent-row__action.kb-action-active {
      box-shadow: 0 0 0 var(--focus-ring) #fff;
      background: rgba(139, 92, 246, 0.45);
      color: #fff;
      font-weight: 600;
    }
    .recent-row--trail.recent-row--icons .recent-row__actions {
      flex-direction: row;
      gap: 8px;
    }
    .recent-row--card.recent-row--icons .recent-row__actions {
      flex-direction: row;
      justify-content: flex-end;
      gap: 8px;
    }
    .recent-action-icon {
      width: var(--icon-size-sm);
      height: var(--icon-size-sm);
      display: block;
    }

    .chrome-actions { display: flex; flex-shrink: 0; align-items: center; gap: 4px; }

    .intent-toast {
      position: fixed; bottom: var(--space-lg); left: 50%; transform: translateX(-50%);
      max-width: min(640px, 92vw); padding: var(--space-md) var(--space-lg);
      background: rgba(13, 14, 31, 0.96);
      border-radius: var(--radius-sm);
      font-size: var(--font-banner); color: var(--muted);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 40;
    }
    .intent-toast.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="app" id="app">
      <aside class="poster-col">
        <img class="poster-col__img" id="posterBg" alt="" referrerpolicy="no-referrer" />
        <div class="poster-col__fade" aria-hidden="true"></div>
      </aside>
      <div class="az-rail" id="azRail">
        <div class="az" id="az"></div>
      </div>
      <div class="main-col">
        <header class="chrome-top chrome-library" id="chromeLibrary">
          <button type="button" class="icon-action" id="recentBtn" title="Recently watched">
            <svg class="icon" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          </button>
          <label class="search-wrap" id="searchWrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="search" id="search" placeholder="Search library…" tabindex="-1" readonly />
          </label>
          <nav class="filter-icons" id="filterIcons"></nav>
          <span class="chrome-divider" aria-hidden="true"></span>
          <div class="chrome-actions" id="chromeActions">
            <button type="button" class="icon-action" id="rebuildBtn" title="Rebuild library">
              <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
          </div>
          <span class="top-status" id="statusTop"></span>
        </header>
        <header class="chrome-recent" id="chromeRecent" hidden>
          <h1 class="recent-page-title" id="recentPageTitle">Recently watched</h1>
        </header>
        <div class="tag-ribbon-wrap" id="tagRibbonWrap">
          <div class="tag-ribbon" id="tagRibbon"></div>
        </div>
        <div class="list-area">
          <div class="list" id="list"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="intent-toast" id="intentToast"></div>
  <div class="file-warn" id="fileWarn">
    <p>Otwórz mockup przez serwer (nie plik z dysku):<br /><code>uv run python -m lumi.ui.screens.library.prototype.mockups</code><br />potem <code>http://127.0.0.1:8765/library-home.html</code></p>
  </div>

  <script>
    const FILTER_ICONS = [
      { id: "All", title: "All", path: "M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" },
      { id: "Films", title: "Films", path: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 16.5v-9l7 4.5l-7 4.5z" },
      { id: "Series", title: "Series", path: "M14 2H4c-1.1 0-2 .9-2 2v10h2V4h10V2zm4 4H8c-1.1 0-2 .9-2 2v10h2V8h10V6zm2 4h-8c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm0 10h-8v-8h8v8z" },
    ];
    const FILTER_IDS = ["All", "Films", "Series"];
    const ALL_TAGS_CHIP_IDX = 0;
    const RECENT_ENTRY_STYLES = ["card", "trail", "play"];
    const RECENT_ENTRY_ALIASES = ["card-icons", "trail-icons", "play-icons"];
    const urlParams = new URLSearchParams(location.search);
    let recentEntryRaw = urlParams.get("recentEntry") || "play";
    let recentActionsIcons = urlParams.get("recentActions") === "icons";
    if (RECENT_ENTRY_ALIASES.includes(recentEntryRaw)) {
      recentActionsIcons = true;
      recentEntryRaw = recentEntryRaw.replace(/-icons$/, "");
    }
    const recentEntryStyle = RECENT_ENTRY_STYLES.includes(recentEntryRaw) ? recentEntryRaw : "play";
    const ICON_PLAY = "M8 5v14l11-7L8 5z";
    const ICON_REPLAY = "M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z";
    const ICON_PLAY_CIRCLE =
      "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 16.5v-9l7 4.5l-7 4.5z";
    const ICON_SERIES =
      "M14 2H4c-1.1 0-2 .9-2 2v10h2V4h10V2zm4 4H8c-1.1 0-2 .9-2 2v10h2V8h10V6zm2 4h-8c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm0 10h-8v-8h8v8z";
    const ICON_BROWSE = {
      episodes: "M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM10 9h8v2h-8V9zm0 4h8v2h-8v-2z",
      film_series: "M14 2H4c-1.1 0-2 .9-2 2v10h2V4h10V2zm4 4H8c-1.1 0-2 .9-2 2v10h2V8h10V6zm2 4h-8c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm0 10h-8v-8h8v8z",
      library: "M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z",
    };

    const ENTRIES = [
      { title: "28 Days Later", alt: null, kind: "film", tags: ["horror", "sci-fi"], poster: "posters/28-days.jpg" },
      {
        title: "Ano Hi Mita Hana no Namae wo Bokutachi wa Mada Shiranai.",
        alt: "Anohana: The Flower We Saw That Day",
        kind: "series",
        seasonCount: 1,
        tags: ["anime", "drama"],
        poster: "posters/alien.jpg",
      },
      { title: "Arrival", alt: "Story of Your Life", kind: "film", tags: ["sci-fi", "drama"], poster: "posters/arrival.jpg" },
      {
        title: "Kaguya-sama wa Kokurasetai: Tensai-tachi no Renai Zunousen",
        alt: "Kaguya-sama: Love Is War",
        kind: "series",
        seasonCount: 3,
        tags: ["anime", "romance", "comedy"],
        poster: "posters/severance.jpg",
      },
      { title: "Kimi no Na wa.", alt: "Your Name.", kind: "film", tags: ["anime", "romance", "drama"], poster: "posters/arrival.jpg" },
      { title: "Koe no Katachi", alt: "A Silent Voice", kind: "film", tags: ["anime", "drama"], poster: "posters/alien.jpg" },
      { title: "Kusuriya no Hitorigoto", alt: "The Apothecary Diaries", kind: "series", seasonCount: 2, tags: ["anime", "drama"], poster: "posters/severance.jpg" },
      { title: "Mad Max: Fury Road", alt: null, kind: "film", tags: ["action"], poster: "posters/madmax.jpg" },
      { title: "Severance", alt: null, kind: "series", seasonCount: 1, tags: ["sci-fi", "thriller"], poster: "posters/severance.jpg" },
      { title: "Shingeki no Kyojin", alt: "Attack on Titan", kind: "series", seasonCount: 4, tags: ["anime", "action", "drama"], poster: "posters/matrix.jpg" },
      {
        title: "Yahari Ore no Seishun Love Comedy wa Machigatteiru. Kan",
        alt: "My Teen Romantic Comedy SNAFU Climax",
        kind: "series",
        seasonCount: 1,
        tags: ["anime", "romance", "comedy"],
        poster: "posters/bttf.jpg",
      },
      { title: "The Matrix", alt: null, kind: "film", tags: ["sci-fi", "action"], poster: "posters/matrix.jpg" },
    ];
    const ALL_TAGS = [...new Set(ENTRIES.flatMap((e) => e.tags))].sort();

    const RECENT = [
      {
        libraryTitle: "Ano Hi Mita Hana no Namae wo Bokutachi wa Mada Shiranai.",
        playable: "S01E11 · The Flower We Saw That Day, the Name We Still Don't Know, and the Promise We Finally Kept Together",
        progress: 0.41,
        when: "Today",
        browseLabel: "Episodes",
        browseTarget: "episodes",
      },
      {
        libraryTitle: "Kaguya-sama wa Kokurasetai: Tensai-tachi no Renai Zunousen",
        playable: "S03E12 · Dual Confessions, Part 2: The War Ends and the Aftermath Begins for Everyone in the Student Council Room",
        progress: 0.67,
        when: "Today",
        browseLabel: "Episodes",
        browseTarget: "episodes",
      },
      {
        libraryTitle: "Kusuriya no Hitorigoto",
        playable: "S01E23 · Maomao Unravels the Empress Dowager's Garden Plot Before the Mid-Autumn Banquet Turns Deadly",
        progress: 0.62,
        when: "Yesterday",
        browseLabel: "Episodes",
        browseTarget: "episodes",
      },
      {
        libraryTitle: "Yahari Ore no Seishun Love Comedy wa Machigatteiru. Kan",
        playable: "S01E05 · And Then Yukino Yukinoshita Regrets Everything She Said in the Service Club Room Last Winter",
        progress: 0.33,
        when: "Yesterday",
        browseLabel: "Episodes",
        browseTarget: "episodes",
      },
      { libraryTitle: "Severance", playable: "S01E04 · The You You Are", progress: 0.55, when: "2d ago", browseLabel: "Episodes", browseTarget: "episodes" },
      { libraryTitle: "Koe no Katachi", playable: "Koe no Katachi", progress: 0.88, when: "3d ago", browseLabel: "In library", browseTarget: "library" },
    ];

    const state = {
      screen: "library",
      filter: "All", search: "", tag: null, selectedId: 0,
      rebuilding: false,
      rebuild: { done: 0, total: 48, dir: "" },
      toast: "",
      focusZone: "entries",
      filterIdx: 0, chromeTarget: "recent", tagIdx: 0, alphabetIdx: 0,
      entryDualAction: "resume",
    };
    let rebuildTimer, toastTimer;

    const entryByTitle = (t) => ENTRIES.find((e) => e.title === t);
    const tagChipCount = () => 1 + ALL_TAGS.length;
    const tagFilterAtIndex = (i) => (i >= 1 ? ALL_TAGS[i - 1] : null);
    const tagIndexForActive = () => {
      if (state.tag) return ALL_TAGS.indexOf(state.tag) + 1;
      return ALL_TAGS_CHIP_IDX;
    };
    const tagIndexForVerticalEntry = () => ALL_TAGS_CHIP_IDX;
    const onRecentPage = () => state.screen === "recent";
    const allTagsActive = () => !state.tag && !onRecentPage();
    const resumeLabel = (p) => (p >= 0.98 ? "Watch again" : "Resume");
    const showRecentBrowse = (r, kind) => !(kind === "film" && r.browseTarget === "library");
    const firstLetter = (t) => { const c = t.trim()[0]?.toUpperCase() || "#"; return /[A-Z]/.test(c) ? c : "#"; };
    const isPrintable = (ev) => ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey;

    function filtered() {
      const pool = ENTRIES.map((e, i) => ({ ...e, id: i }));
      return pool.filter((e) => {
        const q = state.search.trim().toLowerCase();
        if (q && !e.title.toLowerCase().includes(q) && !(e.alt && e.alt.toLowerCase().includes(q))) return false;
        if (state.filter === "Films" && e.kind !== "film") return false;
        if (state.filter === "Series" && e.kind !== "series") return false;
        if (state.tag && !e.tags.includes(state.tag)) return false;
        return true;
      });
    }

    function selectedEntry(list) {
      const i = Math.min(state.selectedId, Math.max(0, list.length - 1));
      return list[i] || ENTRIES[0];
    }

    function showIntent(msg) {
      state.toast = msg;
      clearTimeout(toastTimer);
      render();
      toastTimer = setTimeout(() => { state.toast = ""; render(); }, 3200);
    }

    function activateTagChip() {
      if (state.tagIdx === ALL_TAGS_CHIP_IDX) {
        state.tag = null;
        state.selectedId = 0;
        return;
      }
      const next = tagFilterAtIndex(state.tagIdx);
      state.tag = state.tag === next ? null : next;
      state.selectedId = 0;
    }

    function openRecentPage() {
      state.screen = "recent";
      state.selectedId = 0;
      state.entryDualAction = "resume";
      state.focusZone = "entries";
    }

    function closeRecentPage() {
      state.screen = "library";
      state.selectedId = 0;
      state.entryDualAction = "resume";
    }

    function onRecentResume(r) {
      closeRecentPage();
      state.tag = null;
      state.search = "";
      const list = filtered();
      const idx = list.findIndex((e) => e.title === r.libraryTitle);
      state.selectedId = idx >= 0 ? idx : 0;
      state.focusZone = "entries";
      showIntent(`${resumeLabel(r.progress)} · ${r.playable}`);
    }

    function onRecentBrowse(r) {
      closeRecentPage();
      state.tag = null;
      state.search = "";
      const list = filtered();
      const idx = list.findIndex((e) => e.title === r.libraryTitle);
      state.selectedId = idx >= 0 ? idx : 0;
      state.focusZone = "entries";
      const msg = { library: "Library row", episodes: "Episodes list", film_series: "All films" };
      showIntent(`${msg[r.browseTarget] || r.browseLabel} · ${r.libraryTitle}`);
    }

    function libraryRowMetaHtml(e, show) {
      if (!show) return "";
      if (e.kind === "film") {
        return `<div class="row__meta" aria-hidden="false">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="${ICON_PLAY_CIRCLE}"/></svg>
        </div>`;
      }
      const n = e.seasonCount ?? 1;
      return `<div class="row__meta" aria-hidden="false">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="${ICON_SERIES}"/></svg>
        <span class="row__count">${n}</span>
      </div>`;
    }

    function recentRows() {
      return RECENT.map((r, i) => {
        const e = entryByTitle(r.libraryTitle);
        if (!e) return null;
        return { ...e, id: i, recent: r };
      }).filter(Boolean);
    }

    function recentActionIcon(path) {
      return `<svg class="recent-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`;
    }

    function resumeActionHtml(cls, progress) {
      const label = resumeLabel(progress);
      if (!recentActionsIcons) return `<span class="${cls}">${label}</span>`;
      const icon = progress >= 0.98 ? ICON_REPLAY : ICON_PLAY;
      return `<span class="${cls}" aria-label="${label}">${recentActionIcon(icon)}</span>`;
    }

    function browseActionHtml(cls, r) {
      if (!recentActionsIcons) return `<span class="${cls}">${r.browseLabel}</span>`;
      const icon = ICON_BROWSE[r.browseTarget] || ICON_BROWSE.library;
      return `<span class="${cls}" aria-label="${r.browseLabel}">${recentActionIcon(icon)}</span>`;
    }

    function posterBadgeIcon(r, withBrowse, dual) {
      if (!dual) return r.progress >= 0.98 ? ICON_REPLAY : ICON_PLAY;
      if (!withBrowse || state.entryDualAction === "resume") {
        return r.progress >= 0.98 ? ICON_REPLAY : ICON_PLAY;
      }
      return ICON_BROWSE[r.browseTarget] || ICON_BROWSE.library;
    }

    function recentShowMetaHtml(e, r) {
      const showTitle = r.playable !== r.libraryTitle;
      const alt = e.alt;
      if (!showTitle && !alt) return "";
      const titleHtml = showTitle ? `<div class="recent-row__show-title">${r.libraryTitle}</div>` : "";
      const altHtml = alt ? `<div class="recent-row__show-alt">${alt}</div>` : "";
      return `<div class="recent-row__show-meta">${titleHtml}${altHtml}</div>`;
    }

    function recentRowHtml(e, i, selected, dual) {
      const r = e.recent;
      const pct = Math.round(r.progress * 100);
      const withBrowse = showRecentBrowse(r, e.kind);
      const resumeActive = dual && (!withBrowse || state.entryDualAction === "resume");
      const browseActive = withBrowse && dual && state.entryDualAction === "browse";
      const resumeCls = `recent-row__action btn-resume${resumeActive ? " kb-action-active" : ""}`;
      const browseCls = `recent-row__action btn-browse${browseActive ? " kb-action-active" : ""}`;
      const resumeHtml = resumeActionHtml(resumeCls, r.progress);
      const browseHtml = withBrowse ? browseActionHtml(browseCls, r) : "";
      const showMetaHtml = recentShowMetaHtml(e, r);
      const iconMod = recentActionsIcons ? " recent-row--icons" : "";
      const rowCls = `recent-row recent-row--${recentEntryStyle}${iconMod}${selected ? " selected" : ""}`;

      if (recentEntryStyle === "trail") {
        return `
          <article class="${rowCls}">
            <div class="recent-row__main">
              <div class="recent-row__playable">${r.playable}</div>
              ${showMetaHtml}
              <div class="recent-row__meta-line">
                <div class="recent-row__bar"><span style="width:${pct}%"></span></div>
                <span>${pct}%</span>
                <span>${r.when}</span>
              </div>
            </div>
            <div class="recent-row__actions">
              ${resumeHtml}
              ${browseHtml}
            </div>
          </article>`;
      }

      if (recentEntryStyle === "play") {
        const badgePath = posterBadgeIcon(r, withBrowse, dual);
        const badgeMode = dual && withBrowse && state.entryDualAction === "browse" ? "browse" : "play";
        return `
          <article class="${rowCls}">
            <div class="recent-row__thumb-wrap">
              <div class="recent-row__thumb" style="background-image:url('${e.poster}')"></div>
              <div class="recent-row__play-badge recent-row__play-badge--${badgeMode}" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="${badgePath}"/></svg>
              </div>
            </div>
            <div class="recent-row__body">
              <div class="recent-row__top">
                <div class="recent-row__playable">${r.playable}</div>
                ${showMetaHtml}
              </div>
              <div class="recent-row__gap" aria-hidden="true"></div>
              <div class="recent-row__bottom">
                <div class="recent-row__when">${r.when} · ${pct}%</div>
                <div class="recent-row__bar"><span style="width:${pct}%"></span></div>
                <div class="recent-row__actions">
                  ${resumeHtml}
                  ${browseHtml}
                </div>
              </div>
            </div>
          </article>`;
      }

      return `
        <article class="${rowCls}">
          <div class="recent-row__thumb" style="background-image:url('${e.poster}')"></div>
          <div class="recent-row__meta">
            ${showMetaHtml}
            <div class="recent-row__playable">${r.playable}</div>
            <div class="recent-row__when">${r.when}</div>
            <div class="recent-row__bar"><span style="width:${pct}%"></span></div>
          </div>
          <div class="recent-row__actions">
            ${resumeHtml}
            ${browseHtml}
          </div>
        </article>`;
    }

    function startRebuild() {
      if (state.rebuilding) return;
      state.rebuilding = true;
      state.rebuild.done = 0;
      rebuildTimer = setInterval(() => {
        state.rebuild.done++;
        state.rebuild.dir = ["Films", "Series", "Docs"][state.rebuild.done % 3];
        if (state.rebuild.done >= state.rebuild.total) {
          clearInterval(rebuildTimer);
          state.rebuilding = false;
        }
        render();
      }, 120);
      render();
    }

    function statusText() {
      if (!state.rebuilding) return "";
      const { done, total, dir } = state.rebuild;
      return `Building library… ${done}/${total} — ${dir}`;
    }

    function render() {
      const list = onRecentPage() ? recentRows() : filtered();
      const sel = selectedEntry(list);
      const app = document.getElementById("app");
      app.classList.toggle("rebuilding", state.rebuilding);
      app.classList.toggle("recent-page", onRecentPage());
      document.getElementById("posterBg").src = sel.poster;
      document.getElementById("search").value = state.search;
      document.getElementById("statusTop").textContent = statusText();
      document.getElementById("rebuildBtn").classList.toggle("rebuilding", state.rebuilding);
      document.getElementById("recentBtn").classList.toggle("active", onRecentPage());

      document.getElementById("filterIcons").innerHTML = FILTER_ICONS.map((f, i) => `
        <button type="button" title="${f.title}" class="${state.filter === f.id ? "active" : ""}${state.focusZone === "filters" && state.filterIdx === i ? " kb-focus" : ""}" data-f="${f.id}">
          <svg class="icon" viewBox="0 0 24 24"><path d="${f.path}"/></svg>
        </button>`).join("");

      const tagFocus = state.focusZone === "tags";
      const chips = [
        `<button type="button" class="${allTagsActive() ? "active" : ""}${tagFocus && state.tagIdx === ALL_TAGS_CHIP_IDX ? " kb-focus" : ""}">All tags</button>`,
      ];
      ALL_TAGS.forEach((label, ti) => {
        const i = ti + 1;
        const active = state.tag === label;
        const foc = tagFocus && state.tagIdx === i;
        chips.push(
          `<button type="button" class="${active ? "active" : ""}${foc ? " kb-focus" : ""}">${label}</button>`
        );
      });
      document.getElementById("tagRibbon").innerHTML = chips.join("");

      if (!onRecentPage()) {
        const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")].filter(
          (ch) => ch === "#" || list.some((e) => firstLetter(e.title) === ch)
        );
        if (state.alphabetIdx >= letters.length) state.alphabetIdx = Math.max(0, letters.length - 1);
        const focusLetter = state.focusZone === "alphabet" ? letters[state.alphabetIdx] : null;
        const letterHtml = letters.map((letter) => {
          const classes = [
            firstLetter(sel.title) === letter ? "active" : "",
            focusLetter === letter ? "kb-focus" : "",
          ].filter(Boolean).join(" ");
          return `<div class="az-letter ${classes}" data-letter="${letter}">${letter}</div>`;
        }).join("");
        document.getElementById("az").innerHTML = `<div class="az-stack">${letterHtml}</div>`;
      } else {
        document.getElementById("az").innerHTML = "";
      }

      const listEl = document.getElementById("list");
      listEl.classList.toggle("recent-list", onRecentPage());
      if (onRecentPage()) {
        listEl.innerHTML = list.map((e, i) => {
          const selected = i === state.selectedId;
          const dual = selected && state.focusZone === "entries";
          return recentRowHtml(e, i, selected, dual);
        }).join("");
      } else {
        listEl.innerHTML = list.map((e) => {
          const selected = e.title === sel.title;
          const focused = selected && state.focusZone === "entries";
          const sub = e.alt || "";
          return `
            <div class="row ${selected ? "selected" : ""}${focused ? " focused" : ""}">
              <div class="title">${e.title}</div>
              <div class="alt ${sub ? "" : "empty"}">${sub}</div>
              ${libraryRowMetaHtml(e, focused)}
            </div>`;
        }).join("");
      }

      document.getElementById("searchWrap").classList.toggle("kb-focus", state.focusZone === "search");
      document.getElementById("recentPageTitle").classList.toggle(
        "kb-focus",
        state.focusZone === "recentHeader"
      );
      document.getElementById("recentBtn").classList.toggle(
        "kb-focus",
        state.focusZone === "chrome" && state.chromeTarget === "recent"
      );
      document.getElementById("rebuildBtn").classList.toggle(
        "kb-focus",
        state.focusZone === "chrome" && state.chromeTarget === "rebuild"
      );

      document.getElementById("intentToast").textContent = state.toast;
      document.getElementById("intentToast").classList.toggle("visible", !!state.toast);
    }

    function handleKey(ev) {
      if (ev.key === "Tab") { ev.preventDefault(); return; }

      if (state.focusZone === "search") {
        if (ev.key === "ArrowLeft") {
          ev.preventDefault();
          state.focusZone = "chrome";
          state.chromeTarget = "recent";
          render(); return;
        }
        if (ev.key === "ArrowRight") {
          ev.preventDefault();
          state.focusZone = "filters";
          state.filterIdx = 0;
          render(); return;
        }
        if (ev.key === "ArrowDown") { ev.preventDefault(); state.focusZone = "filters"; state.filterIdx = FILTER_IDS.indexOf(state.filter); render(); return; }
        if (ev.key === "Escape") {
          ev.preventDefault();
          if (state.search) { state.search = ""; state.selectedId = 0; }
          else state.focusZone = "entries";
          render(); return;
        }
        if (isPrintable(ev)) { ev.preventDefault(); state.search += ev.key; state.selectedId = 0; render(); return; }
        if (ev.key === "Backspace") { ev.preventDefault(); state.search = state.search.slice(0, -1); render(); return; }
        return;
      }

      const list = onRecentPage() ? recentRows() : filtered();
      if (isPrintable(ev) && state.focusZone === "entries" && !onRecentPage()) {
        ev.preventDefault(); state.search += ev.key; state.focusZone = "search"; state.selectedId = 0; render(); return;
      }

      if (state.focusZone === "recentHeader") {
        ev.preventDefault();
        if (ev.key === "ArrowDown") {
          state.focusZone = "entries";
          state.selectedId = 0;
          render(); return;
        }
        if (ev.key === "Enter" || ev.key === "Escape") {
          closeRecentPage();
          state.focusZone = "chrome";
          state.chromeTarget = "recent";
          render(); return;
        }
        return;
      }

      if (state.focusZone === "filters") {
        ev.preventDefault();
        if (ev.key === "ArrowLeft") {
          if (state.filterIdx > 0) state.filterIdx--;
          else { state.focusZone = "search"; }
          render(); return;
        }
        if (ev.key === "ArrowRight") {
          if (state.filterIdx < FILTER_IDS.length - 1) state.filterIdx++;
          else { state.focusZone = "chrome"; state.chromeTarget = "rebuild"; }
          render(); return;
        }
        if (ev.key === "ArrowDown") {
          if (onRecentPage()) { state.focusZone = "entries"; }
          else { state.focusZone = "tags"; state.tagIdx = tagIndexForVerticalEntry(); }
          render(); return;
        }
        if (ev.key === "ArrowUp") { state.focusZone = "search"; render(); return; }
        if (ev.key === "Enter") { state.filter = FILTER_IDS[state.filterIdx]; state.selectedId = 0; render(); return; }
        return;
      }

      if (state.focusZone === "chrome") {
        ev.preventDefault();
        if (ev.key === "ArrowLeft") {
          if (state.chromeTarget === "rebuild") {
            state.focusZone = "filters";
            state.filterIdx = FILTER_IDS.length - 1;
            render(); return;
          }
          return;
        }
        if (ev.key === "ArrowRight") {
          if (state.chromeTarget === "recent") {
            state.focusZone = "search";
            render(); return;
          }
          return;
        }
        if (ev.key === "ArrowDown") {
          if (onRecentPage()) { state.focusZone = "entries"; }
          else { state.focusZone = "tags"; state.tagIdx = tagIndexForVerticalEntry(); }
          render(); return;
        }
        if (ev.key === "Enter") {
          if (state.chromeTarget === "recent") openRecentPage();
          else startRebuild();
          render(); return;
        }
        return;
      }

      if (state.focusZone === "tags") {
        ev.preventDefault();
        const max = tagChipCount() - 1;
        if (ev.key === "ArrowLeft") { state.tagIdx = state.tagIdx <= 0 ? max : state.tagIdx - 1; render(); return; }
        if (ev.key === "ArrowRight") { state.tagIdx = state.tagIdx >= max ? 0 : state.tagIdx + 1; render(); return; }
        if (ev.key === "ArrowDown") { state.focusZone = "entries"; render(); return; }
        if (ev.key === "ArrowUp") {
          state.focusZone = "chrome";
          state.chromeTarget = "recent";
          render(); return;
        }
        if (ev.key === "Enter") { activateTagChip(); render(); return; }
        return;
      }

      if (state.focusZone === "alphabet") {
        ev.preventDefault();
        const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")].filter(
          (ch) => ch === "#" || list.some((e) => firstLetter(e.title) === ch)
        );
        if (ev.key === "ArrowDown") { state.alphabetIdx = Math.min(state.alphabetIdx + 1, letters.length - 1); render(); return; }
        if (ev.key === "ArrowUp") { state.alphabetIdx = Math.max(state.alphabetIdx - 1, 0); render(); return; }
        if (ev.key === "ArrowRight") { state.focusZone = "entries"; render(); return; }
        if (ev.key === "Enter") {
          const letter = letters[state.alphabetIdx];
          const idx = list.findIndex((e) => firstLetter(e.title) === letter);
          if (idx >= 0) state.selectedId = idx;
          state.focusZone = "entries";
          render(); return;
        }
        return;
      }

      if (state.focusZone === "entries") {
        if (ev.key === "Escape" && onRecentPage()) {
          ev.preventDefault();
          closeRecentPage();
          state.focusZone = "chrome";
          state.chromeTarget = "recent";
          render(); return;
        }
        if (ev.key === "ArrowUp" && onRecentPage() && state.selectedId <= 0) {
          ev.preventDefault();
          state.focusZone = "recentHeader";
          render(); return;
        }
        if (onRecentPage() && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) {
          ev.preventDefault();
          const row = list[state.selectedId];
          if (row?.recent && showRecentBrowse(row.recent, row.kind)) {
            state.entryDualAction = ev.key === "ArrowLeft" ? "resume" : "browse";
          }
          render(); return;
        }
        if (ev.key === "Enter" && onRecentPage()) {
          ev.preventDefault();
          const row = list[state.selectedId];
          if (!row?.recent) return;
          const dualBrowse = showRecentBrowse(row.recent, row.kind) && state.entryDualAction === "browse";
          (dualBrowse ? onRecentBrowse : onRecentResume)(row.recent);
          render(); return;
        }
        if (ev.key === "ArrowDown") {
          ev.preventDefault(); state.selectedId = Math.min(state.selectedId + 1, Math.max(0, list.length - 1)); render(); return;
        }
        if (ev.key === "ArrowUp") {
          ev.preventDefault();
          if (state.selectedId <= 0) {
            if (onRecentPage()) {
              state.focusZone = "recentHeader";
            } else {
              state.focusZone = "tags";
              state.tagIdx = tagIndexForVerticalEntry();
            }
          } else state.selectedId--;
          render(); return;
        }
        if (ev.key === "ArrowLeft") {
          ev.preventDefault();
          if (onRecentPage()) return;
          state.focusZone = "alphabet";
          const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")].filter(
            (ch) => ch === "#" || list.some((e) => firstLetter(e.title) === ch)
          );
          state.alphabetIdx = Math.max(0, letters.indexOf(firstLetter(selectedEntry(list).title)));
          render(); return;
        }
        if (ev.key === "ArrowRight") {
          ev.preventDefault();
          if (onRecentPage()) return;
          state.focusZone = "tags"; state.tagIdx = tagIndexForActive(); render(); return;
        }
        if (ev.key === "Enter") {
          ev.preventDefault();
          showIntent(`Open “${selectedEntry(list).title}”`);
          return;
        }
      }
    }

    if (location.protocol === "file:") {
      document.getElementById("fileWarn").classList.add("visible");
    }

    document.getElementById("recentBtn").addEventListener("click", () => {
      openRecentPage();
      render();
    });
    window.addEventListener("keydown", handleKey);
    render();
  </script>
</body>
</html>
